  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#101614;
      --surface:#18211e;
      --surface-2:#1f2a26;
      --ink:#e6eeea;
      --muted:#9aaba5;
      --line:#2a3733;
      --accent:#4fae96;
      --accent-ink:#06120f;
      --accent-soft:#1c322c;
      --warn:#e0a85c;
      --warn-soft:#33281a;
      --danger:#e08a8a;
      --danger-soft:#33201f;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
    --wm-opacity:.085;
    --wm-filter:invert(1) grayscale(1);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#101614;
    --surface:#18211e;
    --surface-2:#1f2a26;
    --ink:#e6eeea;
    --muted:#9aaba5;
    --line:#2a3733;
    --accent:#4fae96;
    --accent-ink:#06120f;
    --accent-soft:#1c322c;
    --warn:#e0a85c;
    --warn-soft:#33281a;
    --danger:#e08a8a;
    --danger-soft:#33201f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
    --wm-opacity:.085;
    --wm-filter:invert(1) grayscale(1);
  }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans Arabic","Tajawal",system-ui,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.7;
    -webkit-text-size-adjust:100%;
  }
  /* العلامة المائية — شعار الشركة */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background-image:var(--logo);
    background-repeat:no-repeat;
    background-position:center center;
    background-size:min(64vw, 400px) auto;
    opacity:var(--wm-opacity);
    filter:var(--wm-filter);
  }
  h1,h2,h3,.display{font-family:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;font-weight:700;text-wrap:balance;letter-spacing:0}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;direction:ltr;display:inline-block}
  .wrap{max-width:1140px;margin-inline:auto;padding-inline:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .soft{background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
  .label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:.15s ease;line-height:1.3}
  .btn:hover{border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-ghost{background:transparent}
  .btn-danger{color:var(--danger);border-color:var(--danger)}
  .btn-sm{padding:5px 10px;font-size:13px;border-radius:9px}
  input,select,textarea{font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  input[type="time"],input[type="date"]{font-variant-numeric:tabular-nums}
  /* حقول الوقت تقبل الانكماش كي لا تزاحم زر «الآن» على الشاشات الضيقة */
  input[type="time"]{min-width:0}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid transparent}
  .pill-duty{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .pill-rest{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
  .pill-ot{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
  .tab{padding:8px 12px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:transparent}
  .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:none}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;direction:ltr}
  .sheet-table{table-layout:fixed;min-width:900px}
  .sheet-table td,.sheet-table th{overflow-wrap:break-word;padding-inline:4px}
  .sheet-table th{font-size:11px}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .cal-cell{border:1px solid var(--line);border-radius:10px;min-height:62px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
  .cal-duty{background:var(--accent-soft);border-color:var(--accent)}
  .cal-otday{background:var(--warn-soft);border-color:var(--warn)}
  .cal-today{outline:2px solid var(--accent);outline-offset:1px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .sig-line{border-top:1px dashed var(--muted);padding-top:6px;font-size:12px;color:var(--muted);text-align:center}
  /* شعار الشركة في الشريط العلوي — على أرضية بيضاء ليظهر في الوضعين */
  .brand-mark{width:42px;height:42px;flex:0 0 auto;border-radius:11px;background-color:#fff;
    border:1px solid var(--line);background-image:var(--logo);background-size:78%;
    background-position:center;background-repeat:no-repeat}
  .sheet-logo{width:54px;height:54px;flex:0 0 auto;background-image:var(--logo);background-size:contain;background-position:center;background-repeat:no-repeat}
  @media print{ .sheet-logo{width:46px;height:46px} }
  .paper{background:var(--surface);border:1px solid var(--line);border-radius:14px}
  @page{ margin:14mm 10mm; }
  @media print{
    body::before{display:none}
    body{background:#fff;color:#000;font-size:11px}
    .no-print{display:none!important}
    .paper{border:none;box-shadow:none;border-radius:0;padding:0!important}
    .wrap{padding:0;max-width:none}
    .scroll-x{overflow:visible!important}
    table{font-size:10px;width:100%}
    .sheet-table{min-width:0;width:100%}
    th,td{border-bottom:1px solid #999;padding:4px 3px}
    th{background:#f0f0f0!important;color:#000!important}
    thead{display:table-header-group}
    tr{break-inside:avoid}
    .pill{border:1px solid #666;color:#000!important;background:#fff!important;padding:1px 6px}
    .soft{break-inside:avoid}
    .sig-row{break-inside:avoid;margin-top:16px}
    .paper{break-inside:auto}
    /* ضغط الكشف ليدخل في صفحة واحدة كلما أمكن */
    .paper .soft{padding:7px 10px!important}
    .paper .soft .display{font-size:18px!important;line-height:1.2!important}
    .paper h3{font-size:12px!important}
    .sheet-logo{width:40px;height:40px}
  }
</style>

  function addDays(s, n){ var d = parseD(s); d.setDate(d.getDate()+n); return key(d); }

  var DEF_DAYS = [0,1,2,3,4], DEF_IN = "07:15", DEF_OUT = "14:00", DEF_GRACE = 15;
  function isDayWorker(e){ return !!e && e.type === "day"; }

  /* ============ المزامنة السحابية ============

     الدفع والسحب بختم زمني، والأحدث يغلب. والحذف يُنقل بشواهد (tombstones). */

  function syncOn(){ return !!(SYNC_URL && SYNC_KEY); }
  function sTouch(o){ if(o) o.u = Date.now(); return o; }
  function syncMeta(){
    state.sync = state.sync || { pushedAt:0, pulledAt:"1970-01-01T00:00:00Z", at:null, err:null };

  function tomb(kind, id){

  function sFetch(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({
      "apikey": SYNC_KEY,
      "Authorization": "Bearer " + SYNC_KEY,
      "Content-Type": "application/json"
    }, opts.headers || {});
    return fetch(SYNC_URL.replace(/\/+$/,"") + "/rest/v1/" + path, opts).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + " " + t.slice(0,120)); });
      return r.status === 204 ? null : r.json();
    });
  }
  function sUpsert(table, rows){
    if(!rows.length) return Promise.resolve();
    return sFetch(table, { method:"POST", body:JSON.stringify(rows),
      headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" } });
  }

  function syncPush(){
    var m = syncMeta(), since = m.pushedAt || 0, maxU = since;
    var recs = [], emps = [];

    Object.keys(state.records).forEach(function(k){
      var r = state.records[k];
      if(!r || !(r.u > since)) return;
      var parts = k.split("|");

                  type: r.type || "duty", t: r.t, extra: !!r.extra, u: r.u, deleted: false });
      if(r.u > maxU) maxU = r.u;
    });
    state.employees.forEach(function(e){
      if(!(e.u > since)) return;
      emps.push({ id: SYNC_WS + "|" + e.id, ws: SYNC_WS, emp_id: e.id, data: e, u: e.u, deleted: false });
      if(e.u > maxU) maxU = e.u;
    });
    Object.keys(state.tombs || {}).forEach(function(tk){
      var ts = state.tombs[tk];
      if(!(ts > since)) return;
      var kind = tk.slice(0, tk.indexOf(":")), id = tk.slice(tk.indexOf(":")+1);
      if(kind === "rec"){
        var p = id.split("|");
        recs.push({ id: SYNC_WS + "|" + id, ws: SYNC_WS, emp_id: p[0], day: p[1],
                    type:"duty", t:[null,null,null,null], extra:false, u: ts, deleted: true });
      } else {
        emps.push({ id: SYNC_WS + "|" + id, ws: SYNC_WS, emp_id: id, data:{}, u: ts, deleted: true });
      }
      if(ts > maxU) maxU = ts;
    });

    var settings = null;
    if((state.settingsU || 0) > since){
      settings = [{ ws: SYNC_WS, rates: rates(), holidays: state.holidays || {}, u: state.settingsU }];
      if(state.settingsU > maxU) maxU = state.settingsU;
    }

    return sUpsert("records", recs)
      .then(function(){ return sUpsert("employees", emps); })
      .then(function(){ return settings ? sUpsert("settings", settings) : null; })
      .then(function(){ m.pushedAt = maxU; });
  }

  function syncPull(){
    var m = syncMeta(), since = encodeURIComponent(m.pulledAt);
    var q = "ws=eq." + encodeURIComponent(SYNC_WS) + "&updated_at=gt." + since;
    var mine = (deviceRole() && deviceRole() !== "admin")
      ? "&emp_id=eq." + encodeURIComponent(deviceRole()) : "";
    var newest = m.pulledAt;
    function note(row){ if(row.updated_at && row.updated_at > newest) newest = row.updated_at; }

    return sFetch("records?" + q + mine + "&order=updated_at.asc&limit=5000").then(function(rows){
      (rows||[]).forEach(function(row){
        note(row);
        var k = row.emp_id + "|" + row.day;

        if(local && local.u > (m.pushedAt || 0)) return;
        if(row.deleted){ delete state.records[k]; return; }
        state.records[k] = { type:row.type, t:row.t, extra:!!row.extra, u:row.u || Date.now() };
      });
      return sFetch("employees?" + q + mine + "&order=updated_at.asc&limit=2000");

        if(idx >= 0) state.employees[idx] = e; else state.employees.push(e);
      });
      return sFetch("settings?ws=eq." + encodeURIComponent(SYNC_WS) + "&updated_at=gt." + since);
    }).then(function(rows){
      (rows||[]).forEach(function(row){
        note(row);
        if((state.settingsU || 0) > (m.pushedAt || 0)) return;
        if(row.rates) state.rates = row.rates;
        if(row.holidays) state.holidays = row.holidays;
        state.settingsU = row.u || Date.now();
      });
      m.pulledAt = newest;
    });
  }

  // تقريب الساعات للاحتساب المالي: ما زاد على ٤٥ دقيقة يُرفع ساعةً كاملة، وما دونها يسقط

  function isDutyDay(emp, ds){
    if(!emp) return false;
    // العطلة الرسمية تُعطّل دوام الموظف الصباحي، ولا تغيّر دورية المناوب
    if(isDayWorker(emp)) return !isHoliday(ds) && empDays(emp).indexOf(parseD(ds).getDay()) >= 0;
    if(!emp.startDate) return false;
    var d = diffDays(emp.startDate, ds);
    return ((d % 4) + 4) % 4 === 0;
  }
  function rkey(id, ds){ return id + "|" + ds; }
  function getRec(id, ds){ return state.records[rkey(id,ds)] || null; }
  function ensureRec(id, ds, type){

  // وجبة الدوام: الأساس 24 ساعة، وما بعدها ساعات إضافية
  function dutyStats(rec){
    var out = { started:false, complete:false, base:0, ot:0, short:0, dur:0 };
    if(!rec) return out;
    var t1 = mins(rec.t[0]), t4 = mins(rec.t[3]);
    out.started = t1 !== null;
    if(t1 === null || t4 === null) return out;
    out.complete = true;
    var dur = (t4 + 24*60) - t1;      // البصمة الرابعة في صباح اليوم التالي
    out.dur = dur;
    out.base = Math.min(dur, 24*60);
    out.ot = Math.max(dur - 24*60, 0);
    out.short = Math.max(24*60 - dur, 0);
    return out;
  }
  /* الدوام الصباحي — أربع خانات:
     t0 دخول الدوام · t1 خروج الدوام · t2 دخول العودة الإضافية · t3 خروج العودة
     البقاء بعد نهاية الدوام الرسمي إضافي، وكذلك فترة العودة كاملة.
     إذا بات في الدوام فخروجه صباح اليوم التالي، فتُقسَم ساعاته عند منتصف الليل. */
  function dayStats(emp, rec){
    var o = { started:false, complete:false, base:0, ot:0, otNext:0,
              late:0, short:0, extraOpen:false, overnight:false };
    if(!rec) return o;
    var t0 = mins(rec.t[0]), t1 = mins(rec.t[1]), t2 = mins(rec.t[2]), t3 = mins(rec.t[3]);
    o.started = t0 !== null;
    if(t0 === null) return o;

    var os = mins(empIn(emp)), oe = mins(empOut(emp)), official = oe - os;
    if(t1 !== null){
      o.complete = true;
      // سماح الخروج المبكر: الخروج قبل نهاية الدوام بمدة السماح يُعدّ دواماً كاملاً
      var g = empGrace(emp);
      var effEnd = (t1 < oe && oe - t1 <= g) ? oe : t1;
      o.early = Math.max(0, oe - t1);
      o.base = Math.max(0, Math.min(Math.min(effEnd, oe) - Math.max(t0, os), official));
      o.ot = Math.max(0, t1 - oe);
      o.late = Math.max(0, t0 - os);
      o.short = Math.max(0, official - o.base);
    }
    if(t2 !== null){
      if(t3 === null) o.extraOpen = true;
      else if(t3 >= t2) o.ot += (t3 - t2);
      else { o.ot += (24*60 - t2); o.otNext = t3; o.overnight = true; }
    }
    return o;
  }

  // الدوام في يوم الاستراحة أو العطلة: كل الساعات إضافية
  function restStats(rec){
    var out = { started:false, complete:false, ot:0 };
    if(!rec) return out;
    var a = mins(rec.t[0]), b = mins(rec.t[3]);
    out.started = a !== null;
    if(a === null || b === null) return out;
    out.complete = true;
    var dur = b - a; if(dur <= 0) dur += 24*60;
    out.ot = dur;
    return out;
  }

  /* أقل فاصل زمني مقبول بين بصمتين متتاليتين، بالدقائق.
     يمنع تسجيل البصمات كلها دفعة واحدة. المشرف وحده يتجاوزه. */
  var MIN_GAP = 3 * 60;        // وجبة المناوب: البصمات متباعدة ٧–٩ ساعات طبيعياً
  var MIN_GAP_DAY = 30;        // الدوام الصباحي: بين الدخول والخروج

  function gapProblem(rec, slot, hm, type){
    if(!rec || slot === 0) return null;
    var gap = (type === "duty") ? MIN_GAP : MIN_GAP_DAY;
    var now = mins(hm);
    for(var i = slot - 1; i >= 0; i--){
      var prev = mins(rec.t[i]);
      if(prev === null) continue;
      var diff = now - prev;
      if(diff < 0) diff += 24*60;              // عبَر منتصف الليل
      if(diff < gap){
        return "لم يمضِ إلا "+ fmtH(diff) +" على البصمة السابقة ("+ rec.t[i] +")، "+
               "والمطلوب "+ fmtH(gap) +" على الأقل قبل البصمة التالية.";
      }
      break;
    }
    return null;
  }

  // سجل مشبوه: بصمتان متتاليتان بينهما أقل من الحد الأدنى
  function tooClose(rec, type){
    if(!rec) return false;
    var gap = (type === "duty" || !type) ? MIN_GAP : MIN_GAP_DAY;
    var prev = null;
    for(var i=0;i<4;i++){
      var v = mins(rec.t[i]);
      if(v === null) continue;
      if(prev !== null){
        var d = v - prev; if(d < 0) d += 24*60;
        if(d < gap) return true;
      }
      prev = v;
    }
    return false;
  }

  function getEmp(id){ for(var i=0;i<state.employees.length;i++){ if(state.employees[i].id===id) return state.employees[i]; } return null; }

  /* ============ نطاق الجهاز ============
     جهاز المشرف يرى الجميع، وجهاز الموظف يرى نفسه وحده. */
  function deviceRole(){ return state.device || null; }
  function isAdminDevice(){ return deviceRole() === "admin"; }
  function needsBinding(){ return !deviceRole(); }
  function scopedEmployees(){
    var r = deviceRole();
    if(!r || r === "admin") return state.employees;
    return state.employees.filter(function(e){ return e.id === r; });
  }

  // الساعات الإضافية المحتسبة على تاريخ تقويمي معيّن:
  // تأخير الخروج يقع فجر/نهار اليوم التالي لبداية الوجبة، فيُحسب على ذلك اليوم.
  function otOnDate(empId, ds){
    var emp = getEmp(empId), total = 0;
    if(!emp) return 0;
    if(!isDutyDay(emp, ds)){
      var r = getRec(empId, ds);
      if(r) total += restStats(r).ot;
    } else if(isDayWorker(emp)){
      var dr = getRec(empId, ds);
      if(dr) total += dayStats(emp, dr).ot;   // البقاء بعد الدوام يقع في اليوم نفسه
    }
    var prev = addDays(ds, -1);
    if(isDutyDay(emp, prev)){
      var rec = getRec(empId, prev);
      if(rec){
        // المناوب: تأخّر الخروج يقع في اليوم التالي · الصباحي: ساعات المبيت بعد منتصف الليل
        total += isDayWorker(emp) ? dayStats(emp, rec).otNext : dutyStats(rec).ot;
      }
    }
    return total;
  }

  function monthReport(empId, ym){
    var emp = getEmp(empId);
    var y = Number(ym.split("-")[0]), m = Number(ym.split("-")[1]) - 1;
    var lastD = new Date(y, m+1, 0).getDate();
    var firstDate = key(new Date(y, m, 1, 12));
    var lastDate = key(new Date(y, m, lastD, 12));
    function inMonth(ds){ return ds >= firstDate && ds <= lastDate; }

    var rows = [], scheduled = 0, worked = 0, restWorked = 0;
    var base = 0, ot = 0, openShifts = 0, carryIn = 0, carryOut = 0;
    var otReg = 0, otHol = 0;   // إضافي اعتيادي · إضافي في العطل

    var dayW = isDayWorker(emp);
    // نبدأ المسح من اليوم السابق للشهر: وجبة أو مبيت بدأ أواخر الشهر الماضي قد يقع إضافيه هنا
    var ds = addDays(firstDate, -1);
    while(ds <= lastDate){
      var duty = isDutyDay(emp, ds);
      var rec = getRec(empId, ds);
      var otDate = addDays(ds, 1);

      if(dayW){
        var sd = duty ? dayStats(emp, rec) : null;
        if(duty && !inMonth(ds)){
          // مبيت بدأ آخر الشهر الماضي وامتدّ إلى أول هذا الشهر
          if(sd.otNext > 0 && inMonth(otDate)){
            ot += sd.otNext; otReg += sd.otNext; carryIn += sd.otNext;
            rows.push({ date:ds, duty:true, rec:rec, base:0, ot:sd.otNext, carry:"in",
                        note:"إضافي مبيت مُرحّل من "+ fmtDate(ds) });
          }
        } else if(duty){
          scheduled++;
          var rd = { date:ds, duty:true, rec:rec, base:0, ot:0, carry:null, note:"" };
          var nts = [];
          if(sd.started) worked++;
          if(sd.complete){
            rd.base = sd.base; base += sd.base;
            rd.ot = sd.ot; ot += sd.ot; otReg += sd.ot;
            if(sd.late > 0) nts.push("تأخير "+ fmtH(sd.late));
            if(sd.ot > 0) nts.push("إضافي بعد "+ empOut(emp));
            if(sd.short > 0) nts.push("نقص "+ fmtH(sd.short));
          } else if(sd.started){ nts.push("بدون بصمة خروج"); openShifts++; }
          else nts.push(rec ? "بصمات ناقصة" : "بدون بصمات");
          if(sd.extraOpen) nts.push("عودة بلا بصمة خروج");
          if(sd.otNext > 0){
            if(inMonth(otDate)){ rd.ot += sd.otNext; ot += sd.otNext; otReg += sd.otNext; nts.push("مبيت حتى صباح اليوم التالي"); }
            else { carryOut += sd.otNext; rd.carry = "out";
                   nts.push("إضافي مبيت "+ fmtH(sd.otNext) +" رُحّل إلى الشهر التالي"); }
          }
          rd.note = nts.length ? nts.join(" · ") : "مكتمل";
          rows.push(rd);
        } else if(rec && inMonth(ds)){
          var rh = restStats(rec);
          var rr = { date:ds, duty:false, rec:rec, base:0, ot:0, carry:null, note:"" };
          if(rh.started) restWorked++;
          if(rh.complete){ rr.ot = rh.ot; ot += rh.ot; otHol += rh.ot;
                           rr.note = "دوام في " + (isHoliday(ds) ? ("عطلة رسمية — "+ holidayName(ds)) : "يوم عطلة"); }
          else rr.note = "تسجيل غير مكتمل";
          rows.push(rr);
        }
      } else if(duty && rec && !inMonth(ds)){
        // ترحيل وارد من الشهر السابق: الساعات الإضافية فقط
        var sIn = dutyStats(rec);
        if(sIn.complete && sIn.ot > 0 && inMonth(otDate)){
          ot += sIn.ot; otReg += sIn.ot; carryIn += sIn.ot;
          rows.push({ date:ds, duty:true, rec:rec, base:0, ot:sIn.ot, carry:"in",
                      note:"إضافي مُرحّل من وجبة "+ fmtDate(ds) });
        }
      } else if(duty && inMonth(ds)){
        scheduled++;
        var s = dutyStats(rec);
        var row = { date:ds, duty:true, rec:rec, base:0, ot:0, carry:null, note:"" };
        if(s.started) worked++;
        if(s.complete){
          row.base = s.base; base += s.base;
          if(s.ot > 0){
            if(inMonth(otDate)){ row.ot = s.ot; ot += s.ot; otReg += s.ot; row.note = "إضافي بعد ٢٤ ساعة"; }
            else { row.carry = "out"; carryOut += s.ot;
                   row.note = "إضافي "+ fmtH(s.ot) +" رُحّل إلى الشهر التالي"; }
          }
          else if(s.short > 0) row.note = "نقص " + fmtH(s.short);
          else row.note = "مكتملة";
        } else if(s.started){ row.note = "وجبة غير مكتملة"; openShifts++; }
        else row.note = rec ? "بصمات ناقصة" : "بدون بصمات";
        if(tooClose(rec, "duty")){ row.note += " · بصمات متقاربة — راجعها"; row.flag = true; }
        rows.push(row);
      } else if(!duty && rec && inMonth(ds)){
        var r = restStats(rec);
        var rw = { date:ds, duty:false, rec:rec, base:0, ot:0, carry:null, note:"" };
        if(r.started) restWorked++;
        if(r.complete){ rw.ot = r.ot; ot += r.ot; otReg += r.ot; rw.note = "دوام في يوم استراحة"; }
        else rw.note = "تسجيل غير مكتمل";
        rows.push(rw);
      }
      ds = addDays(ds, 1);
    }

    // توزيع الساعات الإضافية على أسابيع الشهر (١-٧، ٨-١٤، ١٥-٢١، ٢٢-٢٨، وبقية الشهر)
    var WEEK_NAMES = ["الأسبوع الأول","الأسبوع الثاني","الأسبوع الثالث","الأسبوع الرابع"];
    var bounds = [[1,7],[8,14],[15,21],[22,28],[29,31]];
    var weeks = [];
    for(var w=0; w<bounds.length; w++){
      var a = bounds[w][0];
      if(a > lastD) continue;
      var b = Math.min(bounds[w][1], lastD);
      var wOt = 0, wDays = 0;
      for(var dd=a; dd<=b; dd++){
        var wds = key(new Date(y, m, dd, 12));
        wOt += otOnDate(empId, wds);
        if(isDutyDay(emp, wds)){
          var wr = getRec(empId, wds);
          if(wr && dutyStats(wr).started) wDays++;
        }
      }
      weeks.push({ label: w < 4 ? WEEK_NAMES[w] : "بقية الشهر",
                   from:a, to:b, ot:wOt, days:wDays });
    }

    /* الاستحقاق المالي — يُقرَّب مجموع كل بند شهرياً، لا كل يوم على حدة */
    var RT = rates();
    var rReg = dayW ? RT.after : RT.shift;      // المناوب: ٤٠٠٠ لكل إضافيه بلا استثناء
    var rHol = dayW ? RT.holiday : RT.shift;
    var hReg = payHours(otReg), hHol = payHours(otHol);
    var pay = {
      lines: [],
      hours: hReg + hHol,
      amount: hReg*rReg + hHol*rHol
    };
    if(otReg > 0) pay.lines.push({ label: dayW ? "إضافي بعد نهاية الدوام" : "إضافي المناوبة",
                                   mins:otReg, hours:hReg, rate:rReg, amount:hReg*rReg });
    if(otHol > 0) pay.lines.push({ label:"دوام في العطل", mins:otHol, hours:hHol, rate:rHol, amount:hHol*rHol });

    return { emp:emp, ym:ym, rows:rows, scheduled:scheduled, worked:worked, restWorked:restWorked,
             base:base, ot:ot, total:base+ot, openShifts:openShifts,
             carryIn:carryIn, carryOut:carryOut, weeks:weeks,
             otReg:otReg, otHol:otHol, pay:pay };
  }

  /* ---------- لوحة اليوم ---------- */
  function viewToday(){
    var d = ui.day;
    var onDuty = [], ending = [], resting = [], morning = [];
    var LIST = scopedEmployees();
    LIST.forEach(function(e){
      if(isDayWorker(e)){
        if(isDutyDay(e, d)) morning.push(e); else resting.push(e);
        return;
      }
      if(isDutyDay(e, d)){ onDuty.push(e); return; }
      // اليوم الأول من الاستراحة يحتاج بصمة نهاية وجبة الأمس، ويبقى مع ذلك في قائمة الاستراحة
      if(isDutyDay(e, addDays(d,-1))) ending.push(e);
      resting.push(e);
    });

    var h = demoBanner();
    h += '<section class="card" style="padding:14px;margin-bottom:16px">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
        '<div><div class="label">اليوم المعروض</div>'+
        '<div class="display" style="font-size:17px">'+ dayName(d) +' · '+ fmtDate(d) +'</div></div>'+
        '<div style="display:flex;gap:6px;align-items:center">'+
          '<button class="btn btn-sm" data-act="day" data-v="-1">اليوم السابق</button>'+
          '<button class="btn btn-sm" data-act="day" data-v="0">اليوم</button>'+
          '<button class="btn btn-sm" data-act="day" data-v="1">اليوم التالي</button>'+
        '</div></div>'+ holidayBar(d) +'</section>';

    if(!LIST.length){
      return h + emptyState("لا يوجد موظفون بعد", "أضف أول موظف من تبويب «الموظفون» وحدّد تاريخ أول يوم دوام له.");
    }

    var hasShift = LIST.some(function(e){ return !isDayWorker(e); });
    var hasDay = LIST.some(isDayWorker);

    if(hasShift){
      h += sectionTitle("المناوبون في الدوام اليوم", onDuty.length + " موظف");
      h += onDuty.length ? onDuty.map(function(e){ return dutyCard(e, d, false); }).join("")
         : emptyState("لا مناوب في الدوام هذا اليوم", "حسب دورية ١ دوام / ٣ استراحة.");

      if(ending.length){
        h += sectionTitle("بصمة نهاية وجبة الأمس", "بصمة صباح اليوم التالي");
        h += ending.map(function(e){ return dutyCard(e, addDays(d,-1), true); }).join("");
      }
    }

    if(hasDay){
      h += sectionTitle("الدوام الصباحي اليوم", morning.length + " موظف");
      h += morning.length ? morning.map(function(e){ return morningCard(e, d); }).join("")
         : emptyState("لا دوام صباحي اليوم", "اليوم خارج أيام الدوام الرسمية.");
    }

    h += sectionTitle("في الاستراحة أو العطلة", resting.length + " موظف");
    h += resting.length ? resting.map(function(e){ return restCard(e, d); }).join("")
       : '<div class="soft" style="padding:12px;color:var(--muted);font-size:13px;margin-bottom:12px">لا يوجد موظف في الاستراحة اليوم.</div>';
    return h;
  }

  // قراءة حقول نموذج الموظف والتحقّق منها — ترجع null عند الرفض
  function readEmpForm(){
    var name = (document.getElementById("f_name").value||"").trim();
    var dept = (document.getElementById("f_dept").value||"").trim();
    var type = document.getElementById("f_type").value;
    if(!name){ flash("أدخل اسم الموظف."); return null; }

    var data = { name:name, dept:dept, type:type };
    if(type === "day"){
      var tin = document.getElementById("f_in").value || DEF_IN;
      var tout = document.getElementById("f_out").value || DEF_OUT;
      if(mins(tout) <= mins(tin)){ flash("نهاية الدوام يجب أن تكون بعد بدايته."); return null; }
      var wd = [];
      document.querySelectorAll(".f_wd").forEach(function(c){ if(c.checked) wd.push(Number(c.value)); });
      if(!wd.length){ flash("اختر يوم دوام رسمي واحداً على الأقل."); return null; }
      data.startTime = tin; data.endTime = tout; data.workDays = wd;
      data.grace = Math.max(0, Number(document.getElementById("f_grace").value) || 0);
      data.startDate = null;
    } else {
      var start = document.getElementById("f_start").value;
      if(!start){ flash("أدخل تاريخ أول يوم دوام."); return null; }
      data.startDate = start;
      data.startTime = null; data.endTime = null; data.workDays = null; data.grace = null;
    }
    return data;
  }

      h += '<h3 style="font-size:14px;margin:0 0 10px">اختر اسمك</h3>'+
        '<div style="display:grid;gap:8px;margin-bottom:10px">'+
          known.map(function(e){
            return '<button class="btn btn-primary" style="justify-content:space-between;padding:13px 14px;text-align:right" '+
              'data-act="bind-emp" data-id="'+ e.id +'">'+
              '<span>'+ esc(e.name) +'</span>'+
              '<span style="font-size:12px;opacity:.8;font-weight:400">'+ esc(e.dept || "—") +'</span>'+
            '</button>';
          }).join("") +
        '</div>'+
        '<p style="font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.9">'+
        'باختيار اسمك تبقى بصماتك السابقة كما هي وترتفع إلى المشرف.</p>'+
        '<div style="margin-bottom:18px">'+
          '<button class="btn" data-act="self-reg-open">لست في القائمة؟ سجّل بياناتك</button>'+
        '</div>';
    } else {
      h += '<div style="display:grid;gap:8px;margin-bottom:18px">'+
        '<button class="btn btn-primary" style="padding:14px" data-act="self-reg-open">أنا موظف — أسجّل بياناتي</button>'+
        '</div>';
    }

    h += '<div class="soft" style="padding:14px">'+
      '<div style="font-weight:600;font-size:14px;margin-bottom:4px">هذا جهاز المشرف</div>'+
      '<p style="font-size:12px;color:var(--muted);margin:0 0 10px;line-height:1.9">'+
      'يعرض كل الموظفين وكل البصمات والكشوف. يحتاج رمز المشرف.</p>'+
      '<button class="btn btn-primary" data-act="bind-admin">أنا المشرف</button>'+
      '</div>';
    return h;
  }

  // تحديد اليوم المعروض عطلةً رسمية بضغطة واحدة — تُعلنها الدولة فجأةً فلا تقويم ثابتاً لها
  function holidayBar(d){
    var nm = holidayName(d);
    if(nm){
      return '<div class="soft" style="margin-top:10px;padding:9px 12px;border-color:var(--warn);'+
        'display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
        '<div style="font-size:13px"><span class="pill pill-ot">عطلة رسمية</span> '+ esc(nm) +'</div>'+
        '<button class="btn btn-sm btn-danger" data-act="del-holiday" data-date="'+ d +'">إلغاء العطلة</button>'+
      '</div>';
    }
    return '<div style="margin-top:10px">'+
      '<button class="btn btn-sm" data-act="mark-holiday" data-date="'+ d +'">تحديد هذا اليوم عطلة رسمية</button>'+
      '</div>';
  }

  function sectionTitle(t, sub){
    return '<div style="display:flex;align-items:baseline;gap:10px;margin:18px 0 10px">'+
      '<h2 style="font-size:15px;margin:0">'+ esc(t) +'</h2>'+
      '<span style="font-size:12px;color:var(--muted)">'+ esc(sub) +'</span></div>';
  }
  function emptyState(t, s){
    return '<div class="soft" style="padding:20px;text-align:center;margin-bottom:12px">'+
      '<div class="display" style="font-size:15px;margin-bottom:4px">'+ esc(t) +'</div>'+
      '<div style="font-size:13px;color:var(--muted)">'+ esc(s) +'</div></div>';
  }

  function dutyCard(emp, shiftDate, isEnding){
    var rec = getRec(emp.id, shiftDate);
    var s = dutyStats(rec);
    var nextEmpty = -1;
    for(var i=0;i<4;i++){ if(!(rec && rec.t[i])){ nextEmpty = i; break; } }

    var chips = SLOTS.map(function(sl){
      var val = rec ? rec.t[sl.i] : null;
      var dateNote = sl.i === 3 ? '<span style="font-size:11px;color:var(--muted)"> ('+ dayName(addDays(shiftDate,1)) +')</span>' : "";
      return '<div class="soft" style="padding:9px;display:flex;flex-direction:column;gap:6px">'+
        '<div style="font-size:12px;font-weight:600">'+ esc(sl.name) + dateNote +'</div>'+
        '<div style="display:flex;gap:6px;align-items:center">'+
          '<input type="time" id="t_'+ emp.id +'_'+ shiftDate +'_'+ sl.i +'" value="'+ (val||"") +'" data-act="settime" data-emp="'+ emp.id +'" data-date="'+ shiftDate +'" data-slot="'+ sl.i +'" data-type="duty" style="flex:1">'+
          '<button class="btn btn-sm" data-act="now" data-emp="'+ emp.id +'" data-date="'+ shiftDate +'" data-slot="'+ sl.i +'" data-type="duty" title="تسجيل الوقت الحالي">الآن</button>'+
        '</div></div>';
    }).join("");

    var status;
    if(s.complete && s.ot > 0) status = '<span class="pill pill-ot">إضافي <span class="num">'+ fmtH(s.ot) +'</span></span>';
    else if(s.complete) status = '<span class="pill pill-duty">وجبة مكتملة</span>';
    else if(s.started) status = '<span class="pill pill-duty">الوجبة جارية</span>';
    else status = '<span class="pill pill-rest">بانتظار البصمة</span>';

    var quick = nextEmpty >= 0
      ? '<button class="btn btn-primary" data-act="now" data-emp="'+ emp.id +'" data-date="'+ shiftDate +'" data-slot="'+ nextEmpty +'" data-type="duty">بصمة سريعة · '+ esc(SLOTS[nextEmpty].name) +'</button>'
      : '<span class="pill pill-duty">اكتملت البصمات الأربع</span>';

    return '<article class="card" style="padding:14px;margin-bottom:12px">'+
      '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start">'+
        '<div><div class="display" style="font-size:16px">'+ esc(emp.name) +'</div>'+
        '<div style="font-size:12px;color:var(--muted)">'+ esc(emp.dept||"—") +
        (isEnding ? ' · وجبة '+ fmtDate(shiftDate) : '') +'</div></div>'+
        '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+ status +
        (s.complete ? '<span class="pill pill-rest">أساسي <span class="num">'+ fmtH(s.base) +'</span></span>' : '') +'</div>'+
      '</div>'+
      '<div style="margin:12px 0">'+ quick +'</div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">'+ chips +'</div>'+
      '</article>';
  }

  function morningCard(emp, d){
    var rec = getRec(emp.id, d);
    var s = dayStats(emp, rec);
    var t = rec ? rec.t : [null,null,null,null];

    function field(i, name, hint){
      return '<div class="soft" style="padding:9px;display:flex;flex-direction:column;gap:6px">'+
        '<div style="font-size:12px;font-weight:600">'+ esc(name) +
        (hint ? ' <span style="font-size:11px;color:var(--muted);font-weight:400">'+ esc(hint) +'</span>' : '') +'</div>'+
        '<div style="display:flex;gap:6px;align-items:center">'+
          '<input type="time" id="m_'+ emp.id +'_'+ d +'_'+ i +'" value="'+ (t[i]||"") +'" data-act="settime" data-emp="'+ emp.id +'" data-date="'+ d +'" data-slot="'+ i +'" data-type="day" style="flex:1">'+
          '<button class="btn btn-sm" data-act="now" data-emp="'+ emp.id +'" data-date="'+ d +'" data-slot="'+ i +'" data-type="day">الآن</button>'+
        '</div></div>';
    }

    var main = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">'+
      field(0, "بصمة الدخول", "الرسمي "+ empIn(emp)) +
      field(1, "بصمة الخروج", "الرسمي "+ empOut(emp)) +'</div>';

    // كتلة العودة بعد الدوام تظهر بعد تسجيل الخروج، أو إن كانت مستخدمة أصلاً
    var extra = "";
    var extraOn = !!(t[2] || t[3] || (rec && rec.extra));
    if(extraOn){
      extra = '<div style="margin-top:10px">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'+
          '<div style="font-size:12px;font-weight:600;color:var(--warn)">عودة بعد الدوام</div>'+
          '<button class="btn btn-sm btn-danger" data-admin="1" data-act="del-extra" data-emp="'+ emp.id +'" data-date="'+ d +'">إلغاء</button>'+
        '</div>'+
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">'+
          field(2, "دخول العودة", "") +
          field(3, "خروج العودة", "قد يكون صباح "+ dayName(addDays(d,1))) +
        '</div></div>';
    } else if(t[1]){
      extra = '<div style="margin-top:10px"><button class="btn btn-sm" data-act="add-extra" data-emp="'+ emp.id +'" data-date="'+ d +'">تسجيل عودة بعد الدوام</button></div>';
    }

    var pills = "";
    if(s.complete){
      pills += '<span class="pill pill-duty">أساسي <span class="num">'+ fmtH(s.base) +'</span></span>';
      if(s.ot > 0) pills += '<span class="pill pill-ot">إضافي <span class="num">'+ fmtH(s.ot) +'</span></span>';
      if(s.otNext > 0) pills += '<span class="pill pill-ot">مبيت · <span class="num">'+ fmtH(s.otNext) +'</span> غداً</span>';
      if(s.late > 0) pills += '<span class="pill pill-ot">تأخير <span class="num">'+ fmtH(s.late) +'</span></span>';
      if(s.short > 0) pills += '<span class="pill pill-ot">نقص <span class="num">'+ fmtH(s.short) +'</span></span>';
      if(!s.ot && !s.late && !s.short) pills += '<span class="pill pill-duty">مكتمل</span>';
    } else if(s.started) pills = '<span class="pill pill-duty">في الدوام الآن</span>';
    else pills = '<span class="pill pill-rest">بانتظار البصمة</span>';
    if(s.extraOpen) pills += '<span class="pill pill-ot">العودة بلا بصمة خروج</span>';

    var nextEmpty = -1;
    if(!t[0]) nextEmpty = 0;
    else if(!t[1]) nextEmpty = 1;
    else if(extraOn && !t[2]) nextEmpty = 2;
    else if(extraOn && !t[3]) nextEmpty = 3;
    var names = ["الدخول","الخروج","دخول العودة","خروج العودة"];
    var quick = nextEmpty >= 0
      ? '<button class="btn btn-primary" data-act="now" data-emp="'+ emp.id +'" data-date="'+ d +'" data-slot="'+ nextEmpty +'" data-type="day">بصمة سريعة · '+ names[nextEmpty] +'</button>'
      : '<span class="pill pill-duty">اكتملت بصمات اليوم</span>';

    return '<article class="card" style="padding:14px;margin-bottom:12px">'+
      '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start">'+
        '<div><div class="display" style="font-size:16px">'+ esc(emp.name) +'</div>'+
        '<div style="font-size:12px;color:var(--muted)">'+ esc(emp.dept||"—") +' · دوام صباحي '+ esc(empIn(emp)) +' – '+ esc(empOut(emp)) +'</div></div>'+
        '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+ pills +'</div>'+
      '</div>'+
      '<div style="margin:12px 0">'+ quick +'</div>'+
      main + extra +
      '</article>';
  }

  function restCard(emp, d){
    var rec = getRec(emp.id, d);
    var r = restStats(rec);
    var open = rec !== null;
    var body = "";
    if(open){
      body = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px">'+
        '<div class="soft" style="padding:9px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">بداية الدوام الإضافي</div>'+
        '<div style="display:flex;gap:6px"><input type="time" id="r_'+emp.id+'_'+d+'_0" value="'+ (rec.t[0]||"") +'" data-act="settime" data-emp="'+emp.id+'" data-date="'+d+'" data-slot="0" data-type="rest" style="flex:1">'+
        '<button class="btn btn-sm" data-act="now" data-emp="'+emp.id+'" data-date="'+d+'" data-slot="0" data-type="rest">الآن</button></div></div>'+
        '<div class="soft" style="padding:9px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">نهاية الدوام الإضافي</div>'+
        '<div style="display:flex;gap:6px"><input type="time" id="r_'+emp.id+'_'+d+'_3" value="'+ (rec.t[3]||"") +'" data-act="settime" data-emp="'+emp.id+'" data-date="'+d+'" data-slot="3" data-type="rest" style="flex:1">'+
        '<button class="btn btn-sm" data-act="now" data-emp="'+emp.id+'" data-date="'+d+'" data-slot="3" data-type="rest">الآن</button></div></div>'+
        '</div>'+
        '<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">'+
        (r.complete ? '<span class="pill pill-ot">إضافي <span class="num">'+ fmtH(r.ot) +'</span></span>' : '<span class="pill pill-rest">أكمل وقت النهاية</span>')+
        '<button class="btn btn-sm btn-danger" data-admin="1" data-act="del-rest" data-emp="'+emp.id+'" data-date="'+d+'">إلغاء التسجيل</button></div>';
    }
    return '<article class="card" style="padding:12px 14px;margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">'+
        '<div><div style="font-weight:600">'+ esc(emp.name) +'</div>'+
        '<div style="font-size:12px;color:var(--muted)">'+ esc(emp.dept||"—") +' · '+
          (isHoliday(d) ? ("عطلة رسمية — "+ holidayName(d)) : (isDayWorker(emp) ? "عطلة" : "استراحة")) +'</div></div>'+
        (open ? "" : '<button class="btn btn-sm" data-act="add-rest" data-emp="'+emp.id+'" data-date="'+d+'">تسجيل دوام في يوم '+ (isDayWorker(emp) ? "عطلة" : "استراحة") +'</button>')+
      '</div>'+ body +'</article>';
  }

  /* ---------- الموظفون ---------- */
  function viewStaff(){
    var ed = ui.editing;
    var h = demoBanner();
    h += '<section class="card" data-admin="1" style="padding:16px;margin-bottom:16px">'+
      '<h2 style="font-size:15px;margin:0 0 12px">'+ (ed ? "تعديل بيانات موظف" : "إضافة موظف") +'</h2>'+
      empFormFields(ed) +
      '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'+
        '<button class="btn btn-primary" data-act="save-emp">'+ (ed?"حفظ التعديل":"إضافة الموظف") +'</button>'+
        (ed ? '<button class="btn" data-act="cancel-edit">إلغاء</button>' : '')+
      '</div>'+
      '</section>';

    if(!scopedEmployees().length) return h + emptyState("القائمة فارغة", "أضف موظفاً لتبدأ الجدولة.");

    h += '<section class="card" style="padding:0;overflow:hidden"><div class="scroll-x"><table><thead><tr>'+
      '<th>الموظف</th><th>القسم</th><th>النوع</th><th>الجدولة</th><th>حالة اليوم</th><th>الدوام القادم</th><th class="no-print">إجراءات</th>'+
      '</tr></thead><tbody>';
    scopedEmployees().forEach(function(e){
      var dayW = isDayWorker(e);
      var duty = isDutyDay(e, ui.day);
      var next = ui.day;
      for(var i=0;i<8;i++){ if(isDutyDay(e, next)) break; next = addDays(next,1); }
      var del = ui.confirmDel === e.id
        ? '<button class="btn btn-sm btn-danger" data-act="del-emp-yes" data-id="'+e.id+'">تأكيد الحذف</button> <button class="btn btn-sm" data-act="del-emp-no">تراجع</button>'
        : '<button class="btn btn-sm" data-act="edit-emp" data-id="'+e.id+'">تعديل</button> <button class="btn btn-sm btn-danger" data-act="del-emp" data-id="'+e.id+'">حذف</button>';
      h += '<tr><td style="text-align:right;font-weight:600">'+ esc(e.name) +'</td>'+
        '<td>'+ esc(e.dept||"—") +'</td>'+
        '<td>'+ (dayW ? '<span class="pill pill-ot">صباحي</span>' : '<span class="pill pill-duty">مناوب</span>') +'</td>'+
        '<td style="font-size:12px">'+ (dayW
            ? esc(daysLabel(e)) +' · <span class="tnum">'+ esc(empIn(e)) +' – '+ esc(empOut(e)) +'</span>'
            : 'من <span class="tnum">'+ esc(e.startDate||"—") +'</span>') +'</td>'+
        '<td>'+ (duty ? '<span class="pill pill-duty">دوام</span>'
                      : '<span class="pill pill-rest">'+ (dayW ? "عطلة" : "استراحة") +'</span>') +'</td>'+
        '<td style="font-size:12px"><span class="tnum">'+ esc(next) +'</span> · '+ dayName(next) +'</td>'+
        '<td class="no-print" data-admin="1" style="white-space:nowrap">'+ del +'</td></tr>';
    });
    h += '</tbody></table></div></section>';
    return h;
  }

  /* ---------- الجدول الشهري ---------- */
  function viewCalendar(){
    var ym = ui.calMonth;
    var y = Number(ym.split("-")[0]), m = Number(ym.split("-")[1]) - 1;
    var h = demoBanner();
    h += '<section class="card no-print" style="padding:14px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between">'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'+
        '<div><label class="label" for="cal_emp">العرض</label>'+ empSelect("cal_emp", ui.calEmp, true) +'</div>'+
        '<div><label class="label" for="cal_month">الشهر</label><input id="cal_month" type="month" value="'+ ym +'" data-act="cal-month"></div>'+
      '</div>'+
      '<div style="display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center">'+
        '<span style="display:flex;gap:5px;align-items:center"><span class="dot" style="background:var(--accent)"></span> يوم دوام</span>'+
        '<span style="display:flex;gap:5px;align-items:center"><span class="dot" style="background:var(--warn)"></span> دوام في استراحة</span>'+
        '<span style="display:flex;gap:5px;align-items:center"><span class="dot" style="background:var(--line)"></span> استراحة</span>'+
      '</div></section>';

    if(!scopedEmployees().length) return h + emptyState("لا توجد جدولة", "أضف موظفاً أولاً.");

    h += '<h2 style="font-size:16px;margin:0 0 12px">'+ MONTHS_AR[m] +' <span class="num">'+ y +'</span></h2>';
    if(ui.calEmp === "all") h += matrixTable(y, m);
    else h += monthGrid(getEmp(ui.calEmp), y, m);
    return h;
  }

  function empSelect(id, val, withAll){
    var o = withAll ? '<option value="all"'+ (val==="all"?" selected":"") +'>كل الموظفين</option>' : '<option value="">— اختر موظفاً —</option>';
    scopedEmployees().forEach(function(e){
      o += '<option value="'+ e.id +'"'+ (val===e.id?" selected":"") +'>'+ esc(e.name) +'</option>';
    });
    return '<select id="'+ id +'" data-act="'+ id +'">'+ o +'</select>';
  }

  function monthGrid(emp, y, m){
    if(!emp) return emptyState("اختر موظفاً", "لعرض تقويمه الشهري.");
    var last = new Date(y, m+1, 0).getDate();
    var first = new Date(y, m, 1).getDay();
    var cells = "";
    for(var i=0;i<first;i++) cells += '<div></div>';
    var dutyCount = 0, otMins = 0;
    for(var d=1; d<=last; d++){
      var ds = key(new Date(y,m,d,12));
      var duty = isDutyDay(emp, ds);
      var rec = getRec(emp.id, ds);
      var dayOt = otOnDate(emp.id, ds);
      var cls = "cal-cell";
      if(duty){ cls += " cal-duty"; dutyCount++; }
      if(!duty && (rec || dayOt > 0)) cls += " cal-otday";
      if(ds === todayStr()) cls += " cal-today";
      var info = "";
      if(duty && rec){
        var n = rec.t.filter(Boolean).length;
        info = '<div style="font-size:11px;color:var(--muted)">'+ n +'/٤ بصمات</div>';
      }
      if(dayOt > 0){
        info += '<div style="font-size:11px;color:var(--warn);font-weight:600" class="num">+'+ fmtH(dayOt) +'</div>';
        otMins += dayOt;
      }
      cells += '<div class="'+ cls +'"><div style="display:flex;justify-content:space-between;align-items:center">'+
        '<span class="num" style="font-weight:700">'+ d +'</span>'+
        '<span style="font-size:10px;color:var(--muted)">'+ (duty ? "دوام" : (isDayWorker(emp) ? "عطلة" : "استراحة")) +'</span></div>'+ info +'</div>';
    }
    var head = DAYS_AR.map(function(n){ return '<div style="text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding-bottom:4px">'+ n +'</div>'; }).join("");
    return '<section class="card" style="padding:14px">'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">'+
        '<span class="pill pill-duty">أيام الدوام: <span class="num">'+ dutyCount +'</span></span>'+
        '<span class="pill pill-ot">إضافي الشهر: <span class="num">'+ fmtH(otMins) +'</span></span>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">'+ head + cells +'</div></section>';
  }

  function matrixTable(y, m){
    var last = new Date(y, m+1, 0).getDate();
    var head = '<th style="position:sticky;right:0;background:var(--surface-2);text-align:right;min-width:120px">الموظف</th>';
    for(var d=1; d<=last; d++){
      var ds = key(new Date(y,m,d,12));
      head += '<th style="min-width:34px;padding:6px 2px"><div class="num">'+ d +'</div><div style="font-size:10px;font-weight:400">'+ dayName(ds).slice(0,3) +'</div></th>';
    }
    var body = "";
    scopedEmployees().forEach(function(e){
      var row = '<td style="position:sticky;right:0;background:var(--surface);text-align:right;font-weight:600;white-space:nowrap">'+ esc(e.name) +'</td>';
      for(var d=1; d<=last; d++){
        var ds = key(new Date(y,m,d,12));
        var duty = isDutyDay(e, ds);
        var rec = getRec(e.id, ds);
        var bg = "transparent", txt = "·", col = "var(--muted)";
        if(duty){ bg = "var(--accent-soft)"; txt = "د"; col = "var(--accent)"; }
        if(!duty && rec){ bg = "var(--warn-soft)"; txt = "إ"; col = "var(--warn)"; }
        if(duty && rec && dutyStats(rec).ot > 0){ bg = "var(--warn-soft)"; txt = "د+"; col = "var(--warn)"; }
        row += '<td style="padding:4px 2px"><div style="background:'+bg+';color:'+col+';border-radius:6px;font-size:11px;font-weight:700;padding:5px 0">'+ txt +'</div></td>';
      }
      body += '<tr>'+ row +'</tr>';
    });
    return '<section class="card" style="padding:0;overflow:hidden"><div class="scroll-x"><table><thead><tr>'+ head +'</tr></thead><tbody>'+ body +'</tbody></table></div>'+
      '<div style="padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)">د = يوم دوام · د+ = دوام مع ساعات إضافية · إ = دوام في يوم استراحة</div></section>';
  }

  function holidayList(editable){
    var keys = Object.keys(state.holidays || {}).sort();
    if(!keys.length){
      return '<section class="soft" style="padding:18px;text-align:center;font-size:13px;color:var(--muted)">'+
        'لا عطل رسمية مسجّلة بعد.</section>';
    }
    var byYear = {};
    keys.forEach(function(k){ var y = k.slice(0,4); (byYear[y] = byYear[y] || []).push(k); });

    var out = "";
    Object.keys(byYear).sort().forEach(function(y){
      out += '<h3 style="font-size:13px;margin:16px 0 8px;color:var(--muted)">سنة <span class="tnum">'+ y +'</span></h3>'+
        '<div style="display:grid;gap:8px">';
      byYear[y].forEach(function(k){
        var past = k < todayStr();
        out += '<div class="card" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'+ (past ? ';opacity:.65' : '') +'">'+
          '<div><div style="font-weight:600">'+ esc(state.holidays[k] || "عطلة رسمية") +'</div>'+
          '<div style="font-size:12px;color:var(--muted)">'+ dayName(k) +' · '+ fmtDate(k) +'</div></div>'+

        '</div>';

    });
    return '<section>'+ out +'</section>';
  }

  document.addEventListener("click", function(ev){

      var v = (document.getElementById("pin_in").value||"").trim();

    if(a === "sheet-month"){ ui.sheetMonth = el.value || ui.sheetMonth; render(); return; }

  /* ============ توليد PDF ============
     نرسم الكشف على لوحة رسم (canvas) لأن محرّك الرسم في المتصفح يكتب العربية
     موصولة وسليمة، ثم نغلّف الصورة داخل ملف PDF بُني يدوياً بلا أي مكتبة. */

  var PG_W = 1240, PG_H = 1754, MG = 64;          // A4 بدقة 150
  var C_INK = "#16221f", C_MUTED = "#5f716c", C_LINE = "#dde4e0",
      C_ACCENT = "#22705f", C_WARN = "#9a5b10", C_SOFT = "#f1f4f2", C_WSOFT = "#fbecd7";

  function fontAr(size, weight){ return (weight||400)+" "+size+"px 'IBM Plex Sans Arabic','Cairo',sans-serif; "; }

  function pdfCtxSetup(ctx){
    ctx.textBaseline = "middle";
    ctx.direction = "rtl";
  }
  function txtR(ctx, s, x, y, size, color, weight){
    ctx.font = (weight||400)+" "+size+"px 'IBM Plex Sans Arabic', 'Cairo', sans-serif";
    ctx.fillStyle = color; ctx.direction = "rtl"; ctx.textAlign = "right";
    ctx.fillText(s, x, y);
  }
  function txtL(ctx, s, x, y, size, color, weight){
    ctx.font = (weight||400)+" "+size+"px 'IBM Plex Sans Arabic', 'Cairo', sans-serif";
    ctx.fillStyle = color; ctx.direction = "rtl"; ctx.textAlign = "left";
    ctx.fillText(s, x, y);
  }
  function txtC(ctx, s, x, y, size, color, weight, ltr){
    ctx.font = (weight||400)+" "+size+"px 'IBM Plex Sans Arabic', 'Cairo', sans-serif";
    ctx.fillStyle = color; ctx.direction = ltr ? "ltr" : "rtl"; ctx.textAlign = "center";
    ctx.fillText(s, x, y);
  }
  function box(ctx, x, y, w, h, fill, stroke, r){
    r = r || 10;
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
    if(fill){ ctx.fillStyle = fill; ctx.fill(); }
    if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
  }
  function hline(ctx, x1, x2, y, color, w){
    ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y);
    ctx.strokeStyle = color; ctx.lineWidth = w||1; ctx.stroke();
  }
  // يقصّ النص إن تجاوز العرض المتاح
  function fit(ctx, s, size, weight, maxW){
    ctx.font = (weight||400)+" "+size+"px 'IBM Plex Sans Arabic', 'Cairo', sans-serif";
    if(ctx.measureText(s).width <= maxW) return s;
    var t = s;
    while(t.length > 1 && ctx.measureText(t+"…").width > maxW) t = t.slice(0, -1);
    return t + "…";
  }

  function drawSheet(R, logoImg){
    var y = Number(R.ym.split("-")[0]), m = Number(R.ym.split("-")[1]) - 1;
    var rows = R.rows, dayW = isDayWorker(R.emp);
    var ROW_H = 46, HEAD_H = 52;
    var breaks = [];
    // ارتفاع سخيّ: الترويسة والبطاقات والاستحقاق والأسابيع ورأس الجدول وأسطره والمجموع والتواقيع
    var bodyH = 860 + 300 + HEAD_H + rows.length*ROW_H + ROW_H + 220;
    var H = Math.max(PG_H, bodyH);

    var cv = document.createElement("canvas");
    cv.width = PG_W; cv.height = H;
    var ctx = cv.getContext("2d");
    pdfCtxSetup(ctx);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, PG_W, H);

    var R0 = PG_W - MG, L0 = MG, W = R0 - L0;
    var cy = MG + 10;

    /* الترويسة */
    if(logoImg){ try{ ctx.drawImage(logoImg, R0 - 86, cy - 6, 86, 86); }catch(e){} }
    txtR(ctx, "كشف الساعات الشهري", R0 - 100, cy + 24, 36, C_INK, 700);
    txtR(ctx, ORG_NAME, R0 - 100, cy + 60, 20, C_MUTED, 400);
    txtL(ctx, "الشهر: "+ MONTHS_AR[m] +" "+ y, L0, cy + 20, 20, C_INK, 400);
    txtL(ctx, "تاريخ الإصدار: "+ fmtDate(todayStr()), L0, cy + 50, 20, C_MUTED, 400);
    cy += 96;
    hline(ctx, L0, R0, cy, C_ACCENT, 3);
    cy += 24;

    /* بطاقات الملخّص */
    function tileBox(x, w, h, label, value, sub, vColor){
      box(ctx, x, cy, w, h, C_SOFT, C_LINE);
      txtR(ctx, label, x + w - 16, cy + 26, 17, C_MUTED, 600);
      txtR(ctx, value, x + w - 16, cy + 62, 34, vColor || C_INK, 700);
      if(sub) txtR(ctx, fit(ctx, sub, 15, 400, w - 32), x + w - 16, cy + 92, 15, C_MUTED, 400);
    }
    var gap = 12, cols = 3, cw = (W - gap*(cols-1)) / cols, bh = 112;

    box(ctx, R0 - cw, cy, cw, bh, C_SOFT, C_LINE);
    txtR(ctx, "الموظف", R0 - 16, cy + 24, 17, C_MUTED, 600);
    txtR(ctx, fit(ctx, R.emp.name, 24, 700, cw - 32), R0 - 16, cy + 54, 24, C_INK, 700);
    txtR(ctx, fit(ctx, R.emp.dept || "—", 16, 400, cw - 32), R0 - 16, cy + 80, 16, C_MUTED, 400);
    txtR(ctx, fit(ctx, dayW ? ("دوام صباحي · "+ daysLabel(R.emp) +" · "+ empIn(R.emp) +"–"+ empOut(R.emp))
                            : "مناوب · ٢٤ ساعة ثم ٣ أيام استراحة", 14, 400, cw - 32),
         R0 - 16, cy + 100, 14, C_MUTED, 400);

    tileBox(R0 - cw*2 - gap, cw, bh, "أيام الدوام الفعلي", String(R.worked), "من "+ R.scheduled +" يوم مجدول");
    tileBox(L0, cw, bh, "أيام بلا بصمات", String(Math.max(0, R.scheduled - R.worked)), "تحتاج مراجعة");
    cy += bh + gap;

    tileBox(R0 - cw, cw, bh, "الساعات الأساسية", fmtH(R.base), "ساعة:دقيقة");
    tileBox(R0 - cw*2 - gap, cw, bh, "الساعات الإضافية", fmtH(R.ot),
            R.carryIn ? ("يشمل "+ fmtH(R.carryIn) +" مُرحّلة") : "تأخير ودوام العطل", C_WARN);
    tileBox(L0, cw, bh, "مجموع الساعات", fmtH(R.total), "أساسي + إضافي");
    cy += bh + 26;

    /* الاستحقاق المالي */
    var P = R.pay;
    var payH = 92 + (P.lines.length ? (34 + P.lines.length*32 + 34) : 30);
    box(ctx, L0, cy, W, payH, "#ffffff", C_ACCENT, 12);
    box(ctx, L0, cy, W, 92, "#e0efe9", C_ACCENT, 12);
    txtR(ctx, "المبلغ المستحق عن الساعات الإضافية", R0 - 16, cy + 28, 18, C_ACCENT, 600);
    txtR(ctx, fmtIQD(P.amount), R0 - 16, cy + 64, 36, C_ACCENT, 700);
    txtL(ctx, "الساعات المحتسبة: "+ P.hours +" ساعة", L0 + 16, cy + 36, 16, C_MUTED, 400);
    txtL(ctx, "الساعات المسجّلة: "+ fmtH(R.ot), L0 + 16, cy + 62, 16, C_MUTED, 400);
    var py = cy + 92;

    if(P.lines.length){
      var pf = [0.34, 0.17, 0.15, 0.17, 0.17], pxs = [], pacc = R0;
      pf.forEach(function(f){ var w2 = W*f; pxs.push({ x:pacc - w2, w:w2 }); pacc -= w2; });
      var pheads = ["البند","الساعات المسجّلة","المحتسبة","سعر الساعة","المبلغ"];
      ctx.fillStyle = C_SOFT; ctx.fillRect(L0+1, py, W-2, 34);
      pheads.forEach(function(hd, i){ txtC(ctx, hd, pxs[i].x + pxs[i].w/2, py + 17, 14, C_MUTED, 600); });
      py += 34;
      P.lines.forEach(function(l){
        hline(ctx, L0+1, R0-1, py, C_LINE, 1);
        txtR(ctx, fit(ctx, l.label, 15, 400, pxs[0].w - 24), pxs[0].x + pxs[0].w - 12, py + 16, 15, C_INK, 400);
        txtC(ctx, fmtH(l.mins), pxs[1].x + pxs[1].w/2, py + 16, 15, C_INK, 400, true);
        txtC(ctx, String(l.hours), pxs[2].x + pxs[2].w/2, py + 16, 15, C_INK, 700, true);
        txtC(ctx, l.rate.toLocaleString("en-US"), pxs[3].x + pxs[3].w/2, py + 16, 15, C_INK, 400, true);
        txtC(ctx, l.amount.toLocaleString("en-US"), pxs[4].x + pxs[4].w/2, py + 16, 15, C_ACCENT, 700, true);
        py += 32;
      });
      hline(ctx, L0+1, R0-1, py, C_LINE, 1);
      ctx.fillStyle = C_SOFT; ctx.fillRect(L0+1, py, W-2, 33);
      txtR(ctx, "المجموع", pxs[0].x + pxs[0].w - 12, py + 17, 15, C_INK, 700);
      txtC(ctx, String(P.hours), pxs[2].x + pxs[2].w/2, py + 17, 15, C_INK, 700, true);
      txtC(ctx, P.amount.toLocaleString("en-US"), pxs[4].x + pxs[4].w/2, py + 17, 15, C_ACCENT, 700, true);
    } else {
      txtR(ctx, "لا ساعات إضافية في هذا الشهر.", R0 - 16, py + 16, 15, C_MUTED, 400);
    }
    cy += payH + 12;
    txtR(ctx, "تُقرَّب الساعات: ما زاد على ٤٥ دقيقة يُعدّ ساعة كاملة، وما دونها يسقط.", R0, cy, 13, C_MUTED, 400);
    cy += 26;
    breaks.push(cy);

    /* الإضافي حسب الأسابيع */
    txtR(ctx, "الساعات الإضافية حسب أسابيع الشهر", R0, cy + 10, 20, C_INK, 700);
    cy += 32;
    var n = R.weeks.length, wgap = 10, ww = (W - wgap*(n-1)) / n, wh = 92;
    R.weeks.forEach(function(w, i){
      var x = R0 - ww - i*(ww + wgap);
      var hot = w.ot > 0;
      box(ctx, x, cy, ww, wh, hot ? C_WSOFT : C_SOFT, hot ? C_WARN : C_LINE);
      txtR(ctx, w.label, x + ww - 12, cy + 22, 15, C_MUTED, 600);
      txtR(ctx, fmtH(w.ot), x + ww - 12, cy + 52, 28, hot ? C_WARN : C_MUTED, 700);
      txtR(ctx, fit(ctx, "الأيام "+ w.from +"–"+ w.to +" · "+ w.days +" يوم دوام", 13, 400, ww - 24),
           x + ww - 12, cy + 76, 13, C_MUTED, 400);
    });
    cy += wh + 26;

    /* الجدول */
    var heads = dayW
      ? ["التاريخ","اليوم","النوع","دخول","خروج","دخول العودة","خروج العودة","أساسي","إضافي","ملاحظات"]
      : ["التاريخ","اليوم","النوع","صباحية","وسطية","ليلية","صباح التالي","أساسي","إضافي","ملاحظات"];
    var frac = [0.075,0.085,0.085,0.085,0.085,0.085,0.095,0.085,0.085,0.245];
    var xs = [], acc = R0;
    frac.forEach(function(f){ var w2 = W*f; xs.push({ x:acc - w2, w:w2 }); acc -= w2; });

    box(ctx, L0, cy, W, HEAD_H, C_SOFT, C_LINE, 8);
    heads.forEach(function(hd, i){ txtC(ctx, hd, xs[i].x + xs[i].w/2, cy + HEAD_H/2, 15, C_MUTED, 600); });
    cy += HEAD_H;
    var tableTop = cy;

    rows.forEach(function(r){
      var t = r.rec ? r.rec.t : [null,null,null,null];
      if(r.carry || r.flag) { ctx.fillStyle = C_WSOFT; ctx.fillRect(L0, cy, W, ROW_H); }
      hline(ctx, L0, R0, cy + ROW_H, C_LINE, 1);
      var d = parseD(r.date);
      var typ = r.carry === "in" ? "ترحيل" : (r.duty ? "دوام" : (dayW ? "عطلة" : "استراحة"));
      var cells = [
        { v: String(d.getDate()) + (r.carry === "in" ? " "+ MONTHS_AR[d.getMonth()] : ""), ltr:false },
        { v: dayName(r.date), ltr:false },
        { v: typ, ltr:false, color: r.duty && r.carry !== "in" ? C_ACCENT : C_WARN },
        { v: t[0] || "—", ltr:true }, { v: t[1] || "—", ltr:true },
        { v: t[2] || "—", ltr:true }, { v: t[3] || "—", ltr:true },
        { v: r.base ? fmtH(r.base) : "—", ltr:true },
        { v: r.ot ? fmtH(r.ot) : "—", ltr:true, color: r.ot ? C_WARN : C_INK, weight: r.ot ? 700 : 400 },
        { v: r.note || "", ltr:false }
      ];
      cells.forEach(function(c, i){
        var s = fit(ctx, c.v, 15, c.weight || 400, xs[i].w - 10);
        txtC(ctx, s, xs[i].x + xs[i].w/2, cy + ROW_H/2, 15, c.color || C_INK, c.weight || 400, c.ltr);
      });
      cy += ROW_H;
      breaks.push(cy);
    });

    /* المجموع */
    ctx.fillStyle = C_SOFT; ctx.fillRect(L0, cy, W, ROW_H);
    txtR(ctx, "المجموع", xs[6].x + xs[6].w - 12, cy + ROW_H/2, 16, C_INK, 700);
    txtC(ctx, fmtH(R.base), xs[7].x + xs[7].w/2, cy + ROW_H/2, 16, C_INK, 700, true);
    txtC(ctx, fmtH(R.ot), xs[8].x + xs[8].w/2, cy + ROW_H/2, 16, C_WARN, 700, true);
    txtC(ctx, fmtH(R.total), xs[9].x + xs[9].w/2, cy + ROW_H/2, 16, C_INK, 700, true);
    hline(ctx, L0, R0, cy + ROW_H, C_LINE, 1);
    cy += ROW_H + 70;
    breaks.push(cy);

    /* التواقيع */
    var sigs = ["توقيع الموظف","مسؤول الشعبة","المدير الإداري"], sw = W/3;
    sigs.forEach(function(s, i){
      var x = R0 - sw - i*sw;
      ctx.setLineDash([6,5]); hline(ctx, x + 20, x + sw - 20, cy, C_MUTED, 1); ctx.setLineDash([]);
      txtC(ctx, s, x + sw/2, cy + 22, 16, C_MUTED, 400);
    });
    cy += 60;
    breaks.push(cy);

    return { canvas:cv, used:Math.max(cy, PG_H), breaks:breaks, tableTop:tableTop };
  }

  // يقصّ اللوحة الطويلة إلى صفحات A4 دون قطع أي سطر
  function slicePages(res){
    var pages = [], src = res.canvas, total = res.used, offset = 0;
    var guard = 0;
    while(offset < total - 2 && guard++ < 12){
      var limit = offset + PG_H - MG;
      var cut = total;
      if(limit < total){
        cut = offset + 200;
        for(var i=0;i<res.breaks.length;i++){
          if(res.breaks[i] > offset && res.breaks[i] <= limit) cut = res.breaks[i];
        }
        if(cut <= offset) cut = limit;
      }
      var pc = document.createElement("canvas");
      pc.width = PG_W; pc.height = PG_H;
      var c2 = pc.getContext("2d");
      c2.fillStyle = "#ffffff"; c2.fillRect(0,0,PG_W,PG_H);
      c2.drawImage(src, 0, offset, PG_W, cut - offset, 0, MG/2, PG_W, cut - offset);
      pages.push(pc);
      offset = cut;
    }
    return pages.length ? pages : [src];
  }

  /* بناء ملف PDF من صور الصفحات — بلا مكتبات */
  function buildPdf(pages){
    var enc = function(s){ var a = new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i] = s.charCodeAt(i) & 0xff; return a; };
    var parts = [], offsets = [], len = 0;
    function push(u8){ parts.push(u8); len += u8.length; }
    function pushStr(s){ push(enc(s)); }

    var PW = 595.28, PH = 841.89;
    var nPages = pages.length;
    var objCount = 2 + nPages*3;        // catalog + pages + (page, image, content) لكل صفحة
    pushStr("%PDF-1.4\n");

    function mark(i){ offsets[i] = len; }

    mark(1); pushStr("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
    var kids = [];
    for(var i=0;i<nPages;i++) kids.push((3 + i*3) +" 0 R");
    mark(2); pushStr("2 0 obj\n<< /Type /Pages /Kids ["+ kids.join(" ") +"] /Count "+ nPages +" >>\nendobj\n");

    for(var p=0;p<nPages;p++){
      var pageObj = 3 + p*3, imgObj = pageObj + 1, cntObj = pageObj + 2;
      var cv = pages[p];
      var dataUrl = cv.toDataURL("image/jpeg", 0.92);
      var b64 = dataUrl.split(",")[1];
      var bin = atob(b64);
      var jpg = new Uint8Array(bin.length);
      for(var k=0;k<bin.length;k++) jpg[k] = bin.charCodeAt(k);

      mark(pageObj);
      pushStr(pageObj +" 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+ PW.toFixed(2) +" "+ PH.toFixed(2) +"]"+
              " /Resources << /XObject << /Im0 "+ imgObj +" 0 R >> >> /Contents "+ cntObj +" 0 R >>\nendobj\n");

      mark(imgObj);
      pushStr(imgObj +" 0 obj\n<< /Type /XObject /Subtype /Image /Width "+ cv.width +" /Height "+ cv.height +
              " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+ jpg.length +" >>\nstream\n");
      push(jpg);
      pushStr("\nendstream\nendobj\n");

      var content = "q "+ PW.toFixed(2) +" 0 0 "+ PH.toFixed(2) +" 0 0 cm /Im0 Do Q\n";
      mark(cntObj);
      pushStr(cntObj +" 0 obj\n<< /Length "+ content.length +" >>\nstream\n"+ content +"endstream\nendobj\n");
    }

    var xrefPos = len;
    var xref = "xref\n0 "+ (objCount+1) +"\n0000000000 65535 f \n";
    for(var o=1;o<=objCount;o++){
      xref += ("0000000000" + (offsets[o]||0)).slice(-10) + " 00000 n \n";
    }
    pushStr(xref);
    pushStr("trailer\n<< /Size "+ (objCount+1) +" /Root 1 0 R >>\nstartxref\n"+ xrefPos +"\n%%EOF\n");

    var out = new Uint8Array(len), at = 0;
    parts.forEach(function(u){ out.set(u, at); at += u.length; });
    return out;
  }

  function loadLogo(){
    return new Promise(function(res){
      var v = getComputedStyle(document.documentElement).getPropertyValue("--logo") || "";
      var m = v.match(/url\(["']?(data:image\/png;base64,[^"')]+)["']?\)/);
      if(!m) return res(null);
      var im = new Image();
      im.onload = function(){ res(im); };
      im.onerror = function(){ res(null); };
      im.src = m[1];
    });
  }

  function makePdf(){
    if(!ui.sheetEmp || !getEmp(ui.sheetEmp)) { flash("اختر موظفاً وشهراً أولاً."); return Promise.reject(); }
    var R = monthReport(ui.sheetEmp, ui.sheetMonth);
    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    return ready.then(loadLogo).then(function(logo){
      var res = drawSheet(R, logo);
      var pages = slicePages(res);
      var bytes = buildPdf(pages);
      var name = "كشف-"+ R.emp.name.replace(/\s+/g,"-") +"-"+ R.ym +".pdf";
      return { blob: new Blob([bytes], { type:"application/pdf" }), name:name, R:R };
    });
  }

  function sharePdf(){
    closeModal();
    flash("جارٍ تجهيز ملف PDF…");
    makePdf().then(function(out){
      var file = null;
      try{ file = new File([out.blob], out.name, { type:"application/pdf" }); }catch(e){}
      var caption = "كشف الساعات · "+ out.R.emp.name +" · "+ out.R.ym;
      if(file && navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
        navigator.share({ files:[file], title:"كشف الساعات", text:caption }).catch(function(){});
        return;
      }
      var url = URL.createObjectURL(out.blob);
      var a = document.createElement("a");
      a.href = url; a.download = out.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 6000);
      flash("حُفظ ملف PDF — تجده في «التنزيلات» أو «الملفات».");
    }).catch(function(){ flash("تعذّر إنشاء ملف PDF."); });
  }

  /* ============ الطباعة والمشاركة ============ */
  function isStandaloneIOS(){
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var standalone = navigator.standalone === true ||
                     (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    return ios && standalone;
  }

  function doPrint(){
    // iOS لا يفتح نافذة الطباعة داخل التطبيق المثبَّت على الشاشة الرئيسية
    if(isStandaloneIOS()){
      openModal('<h2 style="font-size:16px;margin:0 0 8px">حفظ الكشف PDF من الآيفون</h2>'+
        '<p style="font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.9">'+
        'نظام iOS لا يفتح نافذة الطباعة داخل التطبيق المثبَّت، لكن Safari يحوّل الكشف إلى PDF بخطوتين:</p>'+
        '<ol style="font-size:13px;margin:0 0 14px;padding-inline-start:18px;line-height:2">'+
          '<li>اضغط الزر أدناه ليُفتح الكشف في Safari.</li>'+
          '<li>زر المشاركة ← <b>خيارات</b> أعلى القائمة ← اختر <b>PDF</b> ← ثم واتساب أو «حفظ في الملفات».</li>'+
        '</ol>'+
        '<div style="display:grid;gap:8px">'+
          '<button class="btn btn-primary" data-act="pdf">مشاركة الكشف PDF مباشرة</button>'+
          '<button class="btn" data-act="open-safari">فتح الكشف في Safari</button>'+
          '<button class="btn btn-ghost" data-act="modal-close">إغلاق</button>'+
        '</div>');
      return;
    }
    window.print();
  }

  function copyText(txt, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = "تم النسخ ✓"; setTimeout(function(){ btn.textContent = o; }, 1800); };
    try{
      navigator.clipboard.writeText(txt).then(done).catch(function(){ showText(txt); });
    }catch(e){ showText(txt); }
  }
  function showText(txt){
    openModal('<h2 style="font-size:16px;margin:0 0 8px">النسخة الاحتياطية</h2>'+
      '<p style="font-size:13px;color:var(--muted);margin:0 0 10px">انسخ النص التالي واحفظه في ملف.</p>'+
      '<textarea rows="10" readonly>'+ esc(txt) +'</textarea>'+
      '<div style="display:flex;justify-content:flex-start;margin-top:12px"><button class="btn" data-act="modal-close">إغلاق</button></div>');
  }
  function openPin(){
    openModal('<h2 style="font-size:16px;margin:0 0 8px">وضع المشرف</h2>'+
      '<p style="font-size:13px;color:var(--muted);margin:0 0 10px">تعديل أوقات البصمات وإدارة الموظفين يحتاج رمز المشرف. تسجيل البصمة بزر «الآن» لا يحتاج رمزاً.</p>'+
      '<input id="pin_in" type="password" inputmode="numeric" autocomplete="off" placeholder="الرمز السري" style="text-align:center;letter-spacing:.3em;font-size:18px">'+
      '<div id="pin_err" style="color:var(--danger);font-size:12px;margin-top:6px"></div>'+
      '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary" data-act="pin-submit">فتح</button>'+
      '<button class="btn" data-act="modal-close">إلغاء</button></div>');
    var f = document.getElementById("pin_in");
    if(f){ f.focus(); f.addEventListener("keydown", function(e){ if(e.key === "Enter"){
      var btn = document.querySelector('[data-act="pin-submit"]'); if(btn) btn.click(); } }); }
  }

  function openPinChange(){
    openModal('<h2 style="font-size:16px;margin:0 0 8px">تغيير الرمز على هذا الجهاز</h2>'+
      '<p style="font-size:13px;color:var(--muted);margin:0 0 10px">الرمز الجديد يسري على هذا الجهاز وحده ويبقى حتى لو حُدّث التطبيق. بقية الأجهزة تبقى على الرمز الموجود في الكود.</p>'+
      '<div style="display:grid;gap:8px">'+
        '<input id="pin_new" type="password" inputmode="numeric" autocomplete="off" placeholder="الرمز الجديد">'+
        '<input id="pin_new2" type="password" inputmode="numeric" autocomplete="off" placeholder="تأكيد الرمز الجديد">'+
      '</div>'+
      '<div id="pin_err2" style="color:var(--danger);font-size:12px;margin-top:6px"></div>'+
      '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary" data-act="pin-save">حفظ</button>'+
      '<button class="btn" data-act="modal-close">إلغاء</button></div>');
  }

  function openRestore(){
    openModal('<h2 style="font-size:16px;margin:0 0 8px">استعادة نسخة احتياطية</h2>'+
      '<p style="font-size:13px;color:var(--muted);margin:0 0 10px">الصق نص النسخة الاحتياطية هنا. سيحل محل البيانات الحالية.</p>'+
      '<textarea id="restore_txt" rows="9" placeholder="{ &quot;employees&quot;: [ ... ] }"></textarea>'+
      '<div id="restore_err" style="color:var(--danger);font-size:12px;margin-top:6px"></div>'+
      '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-primary" data-act="restore-apply">استعادة</button>'+
      '<button class="btn" data-act="modal-close">إلغاء</button></div>');
  }
  function openModal(html){
    var m = document.getElementById("modal");
    document.getElementById("modal-body").innerHTML = html;
    m.hidden = false;
  }
  function closeModal(){ document.getElementById("modal").hidden = true; }
  document.getElementById("modal").addEventListener("click", function(ev){ if(ev.target.id === "modal") closeModal(); });

  function flash(msg){
    var d = document.createElement("div");
    d.className = "card no-print";
    d.textContent = msg;
    d.style.cssText = "position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;left:16px;max-width:380px;margin-inline:auto;padding:12px 16px;z-index:70;text-align:center;font-size:14px";
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, 2600);
  }

  /* ============ تثبيت التخزين ============
     يطلب من المتصفح استثناء بيانات التطبيق من المسح التلقائي
     عند ضيق المساحة أو طول عدم الاستخدام. */
  (function persistStorage(){
    try{
      if(!navigator.storage || typeof navigator.storage.persist !== "function") return;
      navigator.storage.persisted().then(function(already){
        if(already) return true;
        return navigator.storage.persist();
      }).then(function(granted){
        try{ localStorage.setItem("storage_persisted", granted ? "1" : "0"); }catch(e){}
      }).catch(function(){});
    }catch(e){}
  })();

  /* ============ الإقلاع ============ */
  if(!load()) seedDemo();
  if(syncOn()){
    setTimeout(function(){ syncNow(true); }, 800);
    window.addEventListener("online", function(){ syncNow(true); });
    setInterval(function(){ syncNow(true); }, 5*60*1000);
  }
  if(isAdminDevice() && !state.employees.length) ui.tab = "staff";
  if(scopedEmployees().length) ui.sheetEmp = scopedEmployees()[0].id;
  render();
})();
</script>

<script>
(function(){
  "use strict";
  /* ===== تسجيل عامل الخدمة (العمل بدون إنترنت) ===== */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        reg.addEventListener("updatefound", function(){
          var nw = reg.installing;
          if(!nw) return;
          nw.addEventListener("statechange", function(){
            if(nw.state === "installed" && navigator.serviceWorker.controller) toast("وصل تحديث للتطبيق — أعد فتحه لتطبيقه.");
          });
        });
      }).catch(function(){});
    });
  }

  /* ===== زر التثبيت (أندرويد / ويندوز / كروم) ===== */
  var deferred = null;
  var btn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred = e; if(btn) btn.hidden = false;
  });
  if(btn) btn.addEventListener("click", function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; btn.hidden = true; });
  });
  window.addEventListener("appinstalled", function(){ if(btn) btn.hidden = true; toast("تم تثبيت التطبيق على جهازك."); });

  /* ===== تلميح التثبيت على iOS ===== */
  var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var hint = document.getElementById("iosHint");
  var hidden = false;
  try{ hidden = localStorage.getItem("ios_hint_off") === "1"; }catch(e){}
  if(isIOS && !standalone && !hidden && hint) hint.hidden = false;
  var hc = document.getElementById("iosHintClose");
  if(hc) hc.addEventListener("click", function(){
    if(hint) hint.hidden = true;
    try{ localStorage.setItem("ios_hint_off","1"); }catch(e){}
  });

  /* ===== مؤشر الاتصال ===== */
  var pill = document.getElementById("netPill");
  function net(){ if(pill) pill.hidden = navigator.onLine; }
  window.addEventListener("online", net); window.addEventListener("offline", net); net();

  /* ===== اختصارات التطبيق (#today, #staff, #calendar, #sheet) ===== */
  function openFromHash(){
    var t = (location.hash || "").replace("#","");
    if(!t) return;
    var b = document.querySelector('#tabs [data-tab="'+ t +'"]');
    if(b) b.click();
  }
  openFromHash();
  window.addEventListener("hashchange", openFromHash);

  function toast(msg){
    var d = document.createElement("div");
    d.className = "card no-print"; d.textContent = msg;
    d.style.cssText = "position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;left:16px;max-width:380px;margin-inline:auto;padding:12px 16px;z-index:70;text-align:center;font-size:14px";
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 3200);
  }
})();
</script>
